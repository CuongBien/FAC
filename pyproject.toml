[project]
name = "fac-speech-f0"
version = "0.1.0"
description = "Ước lượng tần số cơ bản F0 và phân loại Voiced/Unvoiced bằng ACF và AMDF"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "matplotlib>=3.7.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
